[pytest]
testpaths = tests
pythonpath = .
bdd_features_base_dir = tests/features
# Un @known-bug que de repente pasa (XPASS) rompe el build: obliga a revisar el escenario.
xfail_strict = true
addopts =
    -ra
    --strict-markers
    --alluredir=reports/allure-results
    --clean-alluredir
    --output=test-results
    --screenshot=only-on-failure
    --video=retain-on-failure
    --tracing=retain-on-failure
# Tags de Gherkin -> marcas de pytest (--strict-markers rechaza cualquier tag sin declarar).
# Las tags con guion se traducen en tests/conftest.py (hook pytest_bdd_apply_tag).
markers =
    smoke: camino crítico; se ejecuta en cada PR y en todos los navegadores
    regression: resto de la muestra curada; se ejecuta en la regresión completa
    negative: casos negativos o de validación
    known_bug: bug real del sitio (tag @known-bug); xfail estricto con el motivo de data/*/bugs.yaml
    tc(id): identificador de trazabilidad del caso (tag @tc-area-nnn -> TC-AREA-NNN)
