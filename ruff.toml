# Configuración de ruff (linter + formatter)
line-length = 100
target-version = "py312"

[lint]
# E/W: pycodestyle, F: pyflakes, I: isort, B: bugbear, UP: pyupgrade,
# SIM: simplify, PT: estilo pytest, N: nombres PEP 8, RUF: reglas propias de ruff
select = ["E", "F", "W", "I", "B", "UP", "SIM", "PT", "N", "RUF"]

[lint.isort]
known-first-party = ["pages"]
