# Dynamic Catalog (sección nueva del menú lateral)
spinner:
  titulo: Dynamic Catalog - Spinner
  # La web muestra el indicador entre 0,5 y 3 s (aleatorio, verificado en su bundle). El
  # escenario pausa el reloj del navegador y lo avanza este tiempo: resultado determinista
  # sin pausas reales, aunque haya muchos navegadores en paralelo.
  duracion_maxima_carga_ms: 3000
